name: Build Android APK
on:
  push:
  workflow_dispatch:
jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7
      - name: Find project
        run: |
          set -e
          ZIP=$(ls *.zip 2>/dev/null | head -n1 || true)
          if [ -n "$ZIP" ]; then
            rm -rf extracted && mkdir extracted
            unzip -q "$ZIP" -d extracted
            S=$(find extracted -name settings.gradle.kts | head -n1)
          else
            S=$(find . -name settings.gradle.kts -not -path "./.git/*" | head -n1)
          fi
          DIR=$(dirname "$S")
          echo "Project dir: $DIR"
          echo "PROJ=$DIR" >> "$GITHUB_ENV"
          ls "$DIR/app/src/main/java/dadb"
      - name: Build APK
        run: cd "$PROJ" && gradle assembleDebug --no-daemon
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: tvremote-apk
          path: ${{ env.PROJ }}/app/build/outputs/apk/debug/app-debug.apk
