
name: Build Android APK

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Extract Android ZIP
        run: |
          mkdir -p extracted
          unzip -q SmartTVRemote-Android.zip -d extracted

      - name: Build APK
        run: |
          PROJECT_FILE=$(find extracted -type f \( -name settings.gradle -o -name settings.gradle.kts \) -print -quit)

          if [ -z "$PROJECT_FILE" ]; then
            echo "Gradle project not found in ZIP"
            exit 1
          fi

          PROJECT_DIR=$(dirname "$PROJECT_FILE")

          gradle -p "$PROJECT_DIR" :app:assembleDebug --no-daemon

          APK_FILE=$(find "$PROJECT_DIR" -type f -path '*/build/outputs/apk/debug/*.apk' -print -quit)

          if [ -z "$APK_FILE" ]; then
            echo "APK not found"
            exit 1
          fi

          mkdir -p output
          cp "$APK_FILE" output/SmartTVRemote-debug.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: SmartTVRemote-APK
          path: output/SmartTVRemote-debug.apk
          if-no-files-found: error
